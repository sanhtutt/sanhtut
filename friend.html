  <style>
    :root { --ink:#3d3440; --muted:#7c6f7f; --paper:#fffdf8; --pink:#ff8fb1; --yellow:#ffd76a; --blue:#83d9f7; --green:#a9e5bd; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 8% 8%,rgba(255,215,106,.45),transparent 22%),radial-gradient(circle at 90% 12%,rgba(131,217,247,.4),transparent 23%),radial-gradient(circle at 75% 90%,rgba(255,143,177,.3),transparent 25%),#fff5ed; font-family:Georgia,serif; }
    .album { width:100%; min-height:100vh; padding:34px clamp(16px,4vw,64px) 70px; }
    .back-button { display:inline-flex; align-items:center; gap:8px; padding:12px 18px; border:2px solid var(--ink); border-radius:999px; background:var(--paper); color:var(--ink); font:700 .9rem Arial,sans-serif; text-decoration:none; box-shadow:4px 4px 0 var(--yellow); transition:transform .2s,box-shadow .2s; }
    .back-button:hover,.back-button:focus-visible { transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--pink); }
    header { display:flex; justify-content:space-between; align-items:end; gap:28px; margin:44px 0 42px; padding-bottom:26px; border-bottom:2px dashed rgba(61,52,64,.25); }
    .sticker { display:inline-block; margin-bottom:14px; padding:7px 13px; border-radius:999px; background:var(--green); font:800 .75rem Arial,sans-serif; letter-spacing:.1em; text-transform:uppercase; transform:rotate(-2deg); }
    h1 { margin:0; font-size:clamp(3.2rem,8vw,7.5rem); font-weight:400; line-height:.85; letter-spacing:-.07em; }
    .intro { max-width:360px; margin:0; color:var(--muted); font-size:1.08rem; line-height:1.6; }
    .sparkles { color:var(--pink); font-family:Arial,sans-serif; font-size:1.5rem; letter-spacing:.35em; }
    .grid { column-count:4; column-gap:clamp(14px,2vw,24px); }
    figure { --tilt:0deg; display:inline-block; width:100%; margin:0 0 clamp(18px,2.4vw,30px); padding:11px 11px 18px; break-inside:avoid; vertical-align:top; background:var(--paper); border:1px solid rgba(61,52,64,.12); box-shadow:0 10px 24px rgba(101,72,82,.16); transform:rotate(var(--tilt)); transition:transform .25s,box-shadow .25s; }
    figure:nth-child(4n+1) { --tilt:-1deg; }
    figure:nth-child(4n+2) { --tilt:1.2deg; }
    figure:nth-child(4n+3) { --tilt:-.5deg; }
    figure:nth-child(4n) { --tilt:.8deg; }
    figure:nth-child(5n+1) { border-bottom:8px solid var(--pink); }
    figure:nth-child(5n+2) { border-bottom:8px solid var(--yellow); }
    figure:nth-child(5n+3) { border-bottom:8px solid var(--blue); }
    figure:nth-child(5n+4) { border-bottom:8px solid var(--green); }
    figure:hover { position:relative; z-index:2; transform:rotate(0) translateY(-7px); box-shadow:0 18px 34px rgba(101,72,82,.24); }
    .album-video {
        width: 100%;
        margin: 35px 0;
        padding: 12px;
        background: var(--paper);
        border: 1px solid rgba(61, 52, 64, 0.12);
        box-shadow: 0 12px 28px rgba(101, 72, 82, 0.18);
        transform: rotate(-0.4deg);
    }

    .album-video video {
      display: block;
        width: 100%;
        max-height: 75vh;
        object-fit: cover;
    }

    .video-caption {
        padding: 14px 6px 4px;
        color: var(--ink);
        font-size: 1.1rem;
        text-align: center;
    }
    .photo { width:100%; overflow:hidden; background:#eee4df; }
    .photo img { width:100%; height:auto; display:block; transition:transform .35s ease; }
    figure:hover .photo img { transform:scale(1.025); }
    figcaption { padding:13px 5px 0; font-size:1.05rem; }
    figcaption small { display:block; margin-top:5px; color:var(--muted); font:.78rem Arial,sans-serif; }
    footer { margin-top:44px; padding-top:24px; border-top:2px dashed rgba(61,52,64,.2); color:var(--muted); font:.88rem Arial,sans-serif; text-align:center; }
    @media(max-width:1000px) { .grid { column-count:3; } }
    @media(max-width:720px) { header { display:block; margin-top:34px; } .intro { margin-top:24px; } .grid { column-count:2; } }
    @media(max-width:460px) { .album { padding-inline:14px; } .grid { column-count:1; } }
  </style>
