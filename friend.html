<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A happy photo album full of favorite memories.">
  <title>Happy Memories | Photo Album</title>

  <style>
    :root {
      --ink:#3d3440;
      --muted:#7c6f7f;
      --paper:#fffdf8;
      --pink:#ff8fb1;
      --yellow:#ffd76a;
      --blue:#83d9f7;
      --green:#a9e5bd;
    }

    * {
      box-sizing:border-box;
    }

    html {
      scroll-behavior:smooth;
    }

    body {
      margin:0;
      min-height:100vh;
      color:var(--ink);
      background:
        radial-gradient(circle at 8% 8%,rgba(255,215,106,.45),transparent 22%),
        radial-gradient(circle at 90% 12%,rgba(131,217,247,.4),transparent 23%),
        radial-gradient(circle at 75% 90%,rgba(255,143,177,.3),transparent 25%),
        #fff5ed;
      font-family:Georgia,serif;
    }

    .album {
      width:100%;
      min-height:100vh;
      padding:34px clamp(16px,4vw,64px) 70px;
    }

    .back-button {
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:12px 18px;
      border:2px solid var(--ink);
      border-radius:999px;
      background:var(--paper);
      color:var(--ink);
      font:700 .9rem Arial,sans-serif;
      text-decoration:none;
      box-shadow:4px 4px 0 var(--yellow);
      transition:transform .2s,box-shadow .2s;
    }

    .back-button:hover,
    .back-button:focus-visible {
      transform:translate(-2px,-2px);
      box-shadow:7px 7px 0 var(--pink);
    }

    header {
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:28px;
      margin:44px 0 42px;
      padding-bottom:26px;
      border-bottom:2px dashed rgba(61,52,64,.25);
    }

    .sticker {
      display:inline-block;
      margin-bottom:14px;
      padding:7px 13px;
      border-radius:999px;
      background:var(--green);
      font:800 .75rem Arial,sans-serif;
      letter-spacing:.1em;
      text-transform:uppercase;
      transform:rotate(-2deg);
    }

    h1 {
      margin:0;
      font-size:clamp(3.2rem,8vw,7.5rem);
      font-weight:400;
      line-height:.85;
      letter-spacing:-.07em;
    }

    .intro {
      max-width:360px;
      margin:0;
      color:var(--muted);
      font-size:1.08rem;
      line-height:1.6;
    }

    .sparkles {
      color:var(--pink);
      font-family:Arial,sans-serif;
      font-size:1.5rem;
      letter-spacing:.35em;
    }

    .grid {
      column-count:4;
      column-gap:clamp(14px,2vw,24px);
    }

    figure {
      --tilt:0deg;
      display:inline-block;
      width:100%;
      margin:0 0 clamp(18px,2.4vw,30px);
      padding:11px 11px 18px;
      break-inside:avoid;
      vertical-align:top;
      background:var(--paper);
      border:1px solid rgba(61,52,64,.12);
      box-shadow:0 10px 24px rgba(101,72,82,.16);
      transform:rotate(var(--tilt));
      transition:transform .25s,box-shadow .25s;
    }

    figure:nth-child(4n+1) {
      --tilt:-1deg;
    }

    figure:nth-child(4n+2) {
      --tilt:1.2deg;
    }

    figure:nth-child(4n+3) {
      --tilt:-.5deg;
    }

    figure:nth-child(4n) {
      --tilt:.8deg;
    }

    figure:nth-child(5n+1) {
      border-bottom:8px solid var(--pink);
    }

    figure:nth-child(5n+2) {
      border-bottom:8px solid var(--yellow);
    }

    figure:nth-child(5n+3) {
      border-bottom:8px solid var(--blue);
    }

    figure:nth-child(5n+4) {
      border-bottom:8px solid var(--green);
    }

    figure:hover {
      position:relative;
      z-index:2;
      transform:rotate(0) translateY(-7px);
      box-shadow:0 18px 34px rgba(101,72,82,.24);
    }

    .album-video {
      width:100%;
      margin:35px 0;
      padding:12px;
      background:var(--paper);
      border:1px solid rgba(61,52,64,.12);
      box-shadow:0 12px 28px rgba(101,72,82,.18);
      transform:rotate(-0.4deg);
    }

    .album-video video {
      display:block;
      width:100%;
      max-height:75vh;
      object-fit:cover;
    }

    .video-caption {
      padding:14px 6px 4px;
      color:var(--ink);
      font-size:1.1rem;
      text-align:center;
    }

    .photo {
      width:100%;
      overflow:hidden;
      background:#eee4df;
    }

    .photo img {
      width:100%;
      height:auto;
      display:block;
      transition:transform .35s ease;
    }

    figure:hover .photo img {
      transform:scale(1.025);
    }

    figcaption {
      padding:13px 5px 0;
      font-size:1.05rem;
    }

    figcaption small {
      display:block;
      margin-top:5px;
      color:var(--muted);
      font:.78rem Arial,sans-serif;
    }

    .reaction-bar {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:12px 4px 0;
    }

    .reaction-btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:0;
      width:auto;
      min-width:0;
      padding:7px 10px;
      border:1.5px solid rgba(61,52,64,.18);
      border-radius:999px;
      background:#fff;
      color:var(--ink);
      font:700 .8rem Arial,sans-serif;
      cursor:pointer;
      transition:all .2s ease;
    }

    .reaction-btn:hover,
    .reaction-btn:focus-visible {
      transform:translateY(-1px);
      border-color:rgba(61,52,64,.4);
    }

    .reaction-btn.is-active {
      background:linear-gradient(135deg,#fff1f5,#fdf8d9);
      border-color:var(--pink);
      box-shadow:0 8px 16px rgba(255,143,177,.18);
    }

    .reaction-btn:disabled {
      opacity:.55;
      cursor:wait;
    }

    .reaction-btn.has-count {
      gap:6px;
    }

    .reaction-count {
      display:inline-block;
      width:0;
      min-width:0;
      overflow:hidden;
      text-align:center;
      color:var(--muted);
      opacity:0;
      transition:width .2s ease,opacity .2s ease;
    }

    .reaction-btn.has-count .reaction-count {
      width:auto;
      min-width:1.1em;
      opacity:1;
    }

    footer {
      margin-top:44px;
      padding-top:24px;
      border-top:2px dashed rgba(61,52,64,.2);
      color:var(--muted);
      font:.88rem Arial,sans-serif;
      text-align:center;
    }

    @media(max-width:1000px) {
      .grid {
        column-count:3;
      }
    }

    @media(max-width:720px) {
      header {
        display:block;
        margin-top:34px;
      }

      .intro {
        margin-top:24px;
      }

      .grid {
        column-count:2;
      }
    }

    @media(max-width:460px) {
      .album {
        padding-inline:14px;
      }

      .grid {
        column-count:1;
      }
    }
  </style>
</head>

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue,
      runTransaction
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyA5iHA4vk3DinqsXaaWeXgzFIwiwNK3DvE",
      authDomain: "reaction-count-ef7cd.firebaseapp.com",
      databaseURL: "https://reaction-count-ef7cd-default-rtdb.firebaseio.com",
      projectId: "reaction-count-ef7cd",
      storageBucket: "reaction-count-ef7cd.firebasestorage.app",
      messagingSenderId: "161609220537",
      appId: "1:161609220537:web:5b516c20461a7541923668",
      measurementId: "G-N09MBMFK6L"
    };


    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    const reactions = [
      { id:"heart", emoji:"❤️" },
      { id:"fire", emoji:"🔥" },
      { id:"laugh", emoji:"😂" },
      { id:"wow", emoji:"😮" }
    ];


    const figures =
      document.querySelectorAll("figure");


    function getItemID(figure, index) {

      const image =
        figure.querySelector("img");

      const video =
        figure.querySelector("video");


      if (image) {

        const src =
          image.getAttribute("src");

        return "photo_" +
          src
            .split("/")
            .pop()
            .replace(/\./g, "_");

      }


      if (video) {

        const source =
          video.querySelector("source");

        if (source) {

          const src =
            source.getAttribute("src");

          return "video_" +
            src
              .split("/")
              .pop()
              .replace(/\./g, "_");

        }

      }


      return "memory_" + index;

    }



    figures.forEach((figure, index) => {

      const itemID =
        getItemID(figure, index);


      const reactionRef =
        ref(
          database,
          "reactions/" + itemID
        );


      /*
        This key is saved permanently
        in this person's browser.

        Reloading the page will NOT
        make another reaction.
      */

      const localKey =
        "my_reaction_" + itemID;



      const reactionBar =
        document.createElement("div");


      reactionBar.className =
        "reaction-bar";


      figure.appendChild(
        reactionBar
      );



      reactions.forEach((reaction) => {

        const button =
          document.createElement("button");


        button.type =
          "button";


        button.className =
          "reaction-btn";


        button.dataset.reaction =
          reaction.id;


        button.setAttribute(
          "aria-label",
          "React with " + reaction.emoji
        );



        const emoji =
          document.createElement("span");


        emoji.textContent =
          reaction.emoji;



        const count =
          document.createElement("span");


        count.className =
          "reaction-count";



        button.appendChild(
          emoji
        );


        button.appendChild(
          count
        );


        reactionBar.appendChild(
          button
        );



        button.addEventListener(
          "click",
          async () => {

            /*
              Check what this user
              already reacted with.
            */

            const previousReaction =
              localStorage.getItem(
                localKey
              );


            /*
              Disable all reaction
              buttons while updating.
            */

            reactionBar
              .querySelectorAll(
                ".reaction-btn"
              )
              .forEach(btn => {

                btn.disabled = true;

              });



            try {

              await runTransaction(
                reactionRef,
                (currentData) => {

                  const counts =
                    currentData || {};


                  /*
                    SAME REACTION CLICKED

                    Example:

                    User already has ❤️

                    Clicks ❤️ again.

                    Remove their ❤️
                    and decrease count.
                  */

                  if (
                    previousReaction ===
                    reaction.id
                  ) {

                    counts[reaction.id] =
                      Math.max(
                        0,
                        (counts[reaction.id] || 0)
                        - 1
                      );

                  }


                  /*
                    DIFFERENT REACTION

                    Example:

                    User had ❤️

                    Then clicks 🔥

                    ❤️ decreases
                    🔥 increases
                  */

                  else {

                    if (
                      previousReaction
                    ) {

                      counts[
                        previousReaction
                      ] =
                        Math.max(
                          0,
                          (
                            counts[
                              previousReaction
                            ] || 0
                          ) - 1
                        );

                    }


                    counts[
                      reaction.id
                    ] =
                      (
                        counts[
                          reaction.id
                        ] || 0
                      ) + 1;

                  }


                  return counts;

                }
              );



              /*
                SAVE THE USER'S
                REACTION PERMANENTLY
                IN THEIR BROWSER
              */

              if (
                previousReaction ===
                reaction.id
              ) {

                /*
                  They removed
                  their reaction.
                */

                localStorage.removeItem(
                  localKey
                );

              }

              else {

                /*
                  Save the new
                  reaction.
                */

                localStorage.setItem(
                  localKey,
                  reaction.id
                );

              }



              updateSelectedReaction();

            }

            catch (error) {

              console.error(
                "Reaction failed:",
                error
              );

            }

            finally {

              reactionBar
                .querySelectorAll(
                  ".reaction-btn"
                )
                .forEach(btn => {

                  btn.disabled = false;

                });

            }

          }
        );

      });



      /*
        Makes the reaction the user
        selected stay highlighted
        after refreshing.
      */

      function updateSelectedReaction() {

        const savedReaction =
          localStorage.getItem(
            localKey
          );


        reactionBar
          .querySelectorAll(
            ".reaction-btn"
          )
          .forEach(button => {

            button.classList.toggle(
              "is-active",
              button.dataset.reaction ===
              savedReaction
            );

          });

      }



      /*
        Restore reaction immediately
        when page loads.
      */

      updateSelectedReaction();



      /*
        Listen to Firebase.

        EVERYONE sees the same
        reaction counts LIVE.
      */

      onValue(
        reactionRef,
        (snapshot) => {

          const counts =
            snapshot.val() || {};


          reactions.forEach(
            (reaction) => {

              const button =
                reactionBar
                  .querySelector(
                    `[data-reaction="${reaction.id}"]`
                  );


              const count =
                button
                  .querySelector(
                    ".reaction-count"
                  );


              const total =
                counts[
                  reaction.id
                ] || 0;



              if (total > 0) {

                count.textContent =
                  total;


                button.classList.add(
                  "has-count"
                );

              }

              else {

                count.textContent =
                  "";


                button.classList.remove(
                  "has-count"
                );

              }

            }
          );


          /*
            Keep the user's own
            reaction highlighted.
          */

          updateSelectedReaction();

        }
      );

    });

  </script>

</body>
</html>
